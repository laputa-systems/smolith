[package]
name = "laputa-smol"
# When publishing a new version:
# - Update CHANGELOG.md
# - Create "v2.x.y" git tag
version.workspace = true
authors = ["Stjepan Glavina <stjepang@gmail.com>"]
edition = "2021"
# NB: Sync with "MSRV Policy" section in README.md.
rust-version.workspace = true
description = "A small and fast async runtime"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/laputa-systems/smolith"
keywords = ["async", "await", "future", "io", "networking"]
categories = ["asynchronous", "concurrency", "network-programming"]
exclude = ["/.*"]

[lib]
name = "smol"

[dependencies]
async-channel = { workspace = true }
async-executor = { workspace = true }
async-fs = { workspace = true }
async-io = { workspace = true }
async-lock = { workspace = true }
async-net = { workspace = true }
blocking = { workspace = true }
futures-lite = { workspace = true }

[target.'cfg(not(target_os = "espidf"))'.dependencies]
async-process = { workspace = true }

[dev-dependencies]
anyhow = "1"
async-dup = { workspace = true }
async-native-tls = "0.6"
async-tungstenite = { version = "0.35", features = ["async-native-tls"] }
ctrlc = "3"
doc-comment = "0.3"
futures = "0.3"
http = "1.1"
http-body-util = "0.1.0"
http-types = "2"
hyper = { version = "1.0", default-features = false, features = ["client", "http1", "server"] }
macro_rules_attribute = "0.2.0"
native-tls = "0.2"
scraper = "0.29"
signal-hook = "0.4"
smol-hyper = "0.1.0"
smol-macros = { workspace = true }
tempfile = "3"
url = "2"

[target.'cfg(target_os = "linux")'.dev-dependencies]
inotify = { version = "0.11", default-features = false }
rustix = "1.0"
timerfd = "1"

[target.'cfg(not(target_os = "linux"))'.dev-dependencies]
async-h1 = "2"
surf = { version = "2", default-features = false, features = ["h1-client"] }
