[package]
name = "laputa-smol"
version.workspace = true
authors = ["Stjepan Glavina <stjepang@gmail.com>"]
edition = "2021"
# NB: Sync with "MSRV Policy" section in README.md.
rust-version.workspace = true
description = "A small and fast async runtime"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/laputa-systems/smolith"
keywords = ["async", "await", "future", "io", "networking"]
categories = ["asynchronous", "concurrency", "network-programming"]
exclude = ["/.*"]

[lib]
name = "smol"

[dependencies]
async-channel = { workspace = true }
async-executor = { workspace = true }
async-fs = { workspace = true }
async-io = { workspace = true }
async-lock = { workspace = true }
async-net = { workspace = true }
blocking = { workspace = true }
futures-lite = { workspace = true, features = ["race", "std"] }

[target.'cfg(not(target_os = "espidf"))'.dependencies]
async-process = { workspace = true }

[dev-dependencies]
async-dup = { package = "laputa-async-dup", path = "../async-dup" }
ctrlc = "3"
doc-comment = "0.3"
signal-hook = "0.4"
smol-macros = { package = "laputa-smol-macros", path = "../smol-macros" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
inotify = { version = "0.11", default-features = false }
rustix = "1.0"
timerfd = "1"
