[package]
name = "laputa-async-lock"
version.workspace = true
authors = ["Stjepan Glavina <stjepang@gmail.com>"]
edition = "2021"
rust-version.workspace = true
description = "Async synchronization primitives"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/laputa-systems/smolith"
keywords = ["lock", "mutex", "rwlock", "semaphore", "barrier"]
categories = ["asynchronous", "concurrency"]
exclude = ["/.*"]

[lib]
name = "async_lock"

[dependencies]
event-listener = { workspace = true, default-features = false }
event-listener-strategy = { workspace = true, default-features = false }
pin-project-lite = "0.2.11"

[target.'cfg(loom)'.dependencies]
loom = { version = "0.7", optional = true }

[features]
default = ["std"]
std = ["event-listener/std", "event-listener-strategy/std"]
loom = ["event-listener/loom", "dep:loom"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[dev-dependencies]
fastrand = { workspace = true }
flume = "0.12.0"
futures-lite = { workspace = true }
waker-fn = { workspace = true }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "0.3"
