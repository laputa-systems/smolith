[package]
authors = ["Stjepan Glavina <stjepang@gmail.com>", "John Nunley <dev@notgull.net>"]
description = "An asynchronous single-consumer single-producer pipe for bytes."
edition = "2018"
license = "MIT OR Apache-2.0"
name = "laputa-piper"
repository = "https://github.com/laputa-systems/smolith"
version.workspace = true
rust-version.workspace = true

[lib]
name = "piper"

[features]
default = ["std"]
std = ["fastrand/std", "futures-io"]
portable-atomic = ["atomic-waker/portable-atomic", "portable_atomic_crate", "portable-atomic-util"]

[dependencies]
atomic-waker = { workspace = true }
fastrand = { workspace = true, default-features = false }
futures-io = { version = "0.3.28", optional = true }
portable-atomic-util = { version = "0.2.0", features = ["alloc"], optional = true }

[dependencies.portable_atomic_crate]
package = "portable-atomic"
version = "1.2.0"
default-features = false
optional = true

[dev-dependencies]
async-channel = { package = "laputa-async-channel", path = "../async-channel" }
async-executor = { package = "laputa-async-executor", path = "../async-executor" }
async-io = { package = "laputa-async-io", path = "../async-io" }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
easy-parallel = { package = "laputa-easy-parallel", path = "../easy-parallel" }
futures-lite = { package = "laputa-futures-lite", path = "../futures-lite" }

[[bench]]
name = "pipe_comparison"
harness = false
