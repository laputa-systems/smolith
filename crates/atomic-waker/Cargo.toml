[package]
name = "laputa-atomic-waker"
# When publishing a new version:
# - Update CHANGELOG.md
# - Create "v1.x.y" git tag
version.workspace = true
authors = [
  "Stjepan Glavina <stjepang@gmail.com>",
  "Contributors to futures-rs",
]
edition = "2018"
rust-version.workspace = true
description = "A synchronization primitive for task wakeup"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/laputa-systems/smolith"
keywords = ["waker", "notify", "wake", "futures", "async"]
categories = ["asynchronous", "concurrency"]
exclude = ["/.*"]

[lib]
name = "atomic_waker"

[dependencies]
# Uses portable-atomic polyfill atomics on targets without them
portable-atomic = { version = "1", optional = true, default-features = false }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
futures = "0.3.5"
rayon = "1.7.0"

[[bench]]
name = "waker"
harness = false
