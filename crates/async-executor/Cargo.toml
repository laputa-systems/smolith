[package]
name = "laputa-async-executor"
version.workspace = true
authors = ["Stjepan Glavina <stjepang@gmail.com>", "John Nunley <dev@notgull.net>"]
edition = "2021"
rust-version.workspace = true
description = "Async executor"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/laputa-systems/smolith"
keywords = ["asynchronous", "executor", "single", "multi", "spawn"]
categories = ["asynchronous", "concurrency"]
exclude = ["/.*"]

[lib]
name = "async_executor"

[features]
# Adds support for executors optimized for use in static variables.
static = []

[dependencies]
async-task = { workspace = true }
concurrent-queue = { workspace = true }
fastrand = { workspace = true }
futures-lite = { workspace = true, default-features = false }
pin-project-lite = "0.2"
slab = "0.4.7"

[target.'cfg(target_family = "wasm")'.dependencies]
futures-lite = { workspace = true, default-features = false, features = ["std"] }

[dev-dependencies]
async-channel = { package = "laputa-async-channel", path = "../async-channel" }
async-io = { package = "laputa-async-io", path = "../async-io" }
async-lock = { package = "laputa-async-lock", path = "../async-lock" }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
easy-parallel = { package = "laputa-easy-parallel", path = "../easy-parallel" }
fastrand = { package = "laputa-fastrand", path = "../fastrand" }
futures-lite = { package = "laputa-futures-lite", path = "../futures-lite" }
once_cell = "1.16.0"

[[bench]]
name = "executor"
harness = false
required-features = ["static"]

[package.metadata.docs.rs]
all-features = true
