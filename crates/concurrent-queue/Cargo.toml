[package]
name = "laputa-concurrent-queue"
version.workspace = true
authors = [
    "Stjepan Glavina <stjepang@gmail.com>",
    "Taiki Endo <te316e89@gmail.com>",
    "John Nunley <dev@notgull.net>"
]
edition = "2021"
rust-version.workspace = true
description = "Concurrent multi-producer multi-consumer queue"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/laputa-systems/smolith"
keywords = ["channel", "mpmc", "spsc", "spmc", "mpsc"]
categories = ["concurrency"]
exclude = ["/.*"]

[lib]
name = "concurrent_queue"
bench = false

[dependencies]
crossbeam-utils = { version = "0.8.11", default-features = false }
portable-atomic = { version = "1", default-features = false, optional = true }

# Enables loom testing. This feature is permanently unstable and the API may
# change at any time.
[target.'cfg(loom)'.dependencies]
loom = { version = "0.7", optional = true }

[[bench]]
name = "bench"
harness = false

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
easy-parallel = { package = "laputa-easy-parallel", path = "../easy-parallel" }
fastrand = { package = "laputa-fastrand", path = "../fastrand" }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[features]
default = ["std"]
std = []
