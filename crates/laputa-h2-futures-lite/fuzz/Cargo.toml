
[package]
name = "h2-oss-fuzz"
version = "0.0.0"
authors = [ "David Korczynski <david@adalogics.com>" ]
publish = false
edition = "2018"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1",  features = ["derive"] }
libfuzzer-sys = { version = "0.4.0", features = ["arbitrary-derive"] }
futures-lite = { workspace = true }
h2 = { workspace = true, features = [ "unstable" ] }
h2-support = { workspace = true }
futures = { version = "0.3", default-features = false, features = ["std"] }
http = "1"

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[workspace.dependencies]
h2 = { package = "laputa-h2-futures-lite", path = "..", version = "=0.4.20-beta.2" }
h2-support = { path = "../tests/h2-support", version = "0.1.0" }
futures-lite = { package = "laputa-futures-lite", path = "../../futures-lite", version = "0.3.0", features = ["std"] }

[[bin]]
name = "fuzz_client"
path = "fuzz_targets/fuzz_client.rs"
test = false
doc = false

[[bin]]
name = "fuzz_hpack"
path = "fuzz_targets/fuzz_hpack.rs"
test = false
doc = false

[[bin]]
name = "fuzz_e2e"
path = "fuzz_targets/fuzz_e2e.rs"
test = false
doc = false
