[package]
name = "laputa-h2-futures-lite"
version = "0.4.20-beta.2"
license = "MIT"
authors = [
  "Carl Lerche <me@carllerche.com>",
  "Sean McArthur <sean@seanmonstar.com>",
]
description = "An HTTP/2 client and server"
documentation = "https://docs.rs/laputa-h2-futures-lite"
repository = "https://github.com/laputa-systems/smolith"
readme = "README.md"
keywords = ["http", "async", "non-blocking"]
categories = ["asynchronous", "web-programming", "network-programming"]
exclude = ["fixtures/**", "ci/**"]
edition = "2021"
rust-version = "1.85"
autoexamples = false
autobenches = false

[lib]
name = "h2"

[features]
# Enables `tracing` instrumentation.
tracing = ["dep:tracing"]

# Enables `futures::Stream` implementations for various types.
stream = []

# Enables **unstable** APIs. Any API exposed by this feature has no backwards
# compatibility guarantees. In other words, you should not use this feature for
# anything besides experimentation. Definitely **do not** publish a crate that
# depends on this feature.
unstable = []

[dependencies]
atomic-waker = { workspace = true }
futures-core = { workspace = true }
futures-sink = { workspace = true }
log = "0.4"
pin-project-lite = "0.2"
futures-io = { workspace = true }
futures-lite = { workspace = true, features = ["std"] }
bytes = "1"
http = "1.1"
tracing = { version = "0.1.35", default-features = false, features = ["std"], optional = true }
fnv = "1.0.5"
slab = "0.4.2"
indexmap = { version = "2", features = ["std"] }

[dev-dependencies]
laputa-protocol-test-support = { package = "laputa-protocol-test-support", path = "../laputa-protocol-test-support" }

# Fuzzing
quickcheck = { version = "1.0.3", default-features = false }
rand = "0.8.4"

# HPACK fixtures
hex = "0.4.3"
walkdir = "2.3.2"
serde = "1.0.0"
serde_json = "1.0.0"

# Examples
env_logger = { version = "0.10", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[package.metadata.docs.rs]
features = ["stream"]

