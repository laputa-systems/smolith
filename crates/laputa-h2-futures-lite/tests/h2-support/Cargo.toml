[package]
name = "h2-support"
version = "0.1.0"
authors = ["Carl Lerche <me@carllerche.com>"]
publish = false
edition = "2018"
rust-version = "1.89"

[dependencies]
h2 = { workspace = true, features = ["stream", "unstable"] }
laputa-protocol-test-support = { package = "laputa-protocol-test-support", version = "0.1.0", path = "../../../laputa-protocol-test-support" }
smol = { workspace = true }

atty = "0.2"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
tracing-tree = "0.2"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
futures-io = "0.3"
futures-lite = { workspace = true, features = ["std"] }
http = "1"
