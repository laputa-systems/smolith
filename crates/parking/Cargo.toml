[package]
name = "laputa-parking"
version.workspace = true
authors = [
  "Stjepan Glavina <stjepang@gmail.com>",
  "The Rust Project Developers",
]
edition = "2018"
rust-version.workspace = true
description = "Thread parking and unparking"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/laputa-systems/smolith"
homepage = "https://github.com/smol-rs/parking"
documentation = "https://docs.rs/laputa-parking"
keywords = ["park", "notify", "thread", "wake", "condition"]
categories = ["concurrency"]
exclude = ["/.*"]

# The `loom` feature, combined with the `loom` rustflag, enables a reimplementation
# of `parking` using `loom`. This feature is perma-unstable and should not be used
# in stable code.
[lib]
name = "parking"

[target.'cfg(loom)'.dependencies.loom]
version = "0.7"
optional = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[dev-dependencies]
easy-parallel = { package = "laputa-easy-parallel", path = "../easy-parallel" }
