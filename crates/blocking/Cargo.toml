[package]
name = "laputa-blocking"
# When publishing a new version:
# - Update CHANGELOG.md
# - Create "v1.x.y" git tag
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "A thread pool for isolating blocking I/O in async programs"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/laputa-systems/smolith"
keywords = ["async", "file", "stdio", "stdin", "process"]
categories = ["asynchronous", "concurrency"]
exclude = ["/.*"]

[lib]
name = "blocking"

[dependencies]
async-channel = { workspace = true }
async-task = { workspace = true }
futures-io = { version = "0.3.28", default-features = false, features = ["std"] }
futures-lite = { workspace = true, default-features = false }
piper = { workspace = true }
tracing = { version = "0.1.37", default-features = false, optional = true }

[dev-dependencies]
futures-lite = { workspace = true }
