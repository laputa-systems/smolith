[package]
name = "laputa-async-fs"
# When publishing a new version:
# - Update CHANGELOG.md
# - Create "v2.x.y" git tag
version.workspace = true
authors = ["Stjepan Glavina <stjepang@gmail.com>"]
edition = "2021"
rust-version.workspace = true
description = "Async filesystem primitives"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/laputa-systems/smolith"
homepage = "https://github.com/smol-rs/async-fs"
documentation = "https://docs.rs/async-fs"
keywords = ["asynchronous", "file", "filesystem", "io"]
categories = ["asynchronous", "concurrency"]
exclude = ["/.*"]

[lib]
name = "async_fs"

[dependencies]
async-lock = { workspace = true }
blocking = { workspace = true }
futures-lite = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.78"

[target.'cfg(windows)'.dev-dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Storage_FileSystem",
]
