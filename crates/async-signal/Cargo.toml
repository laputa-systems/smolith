[package]
name = "laputa-async-signal"
version.workspace = true
edition = "2021"
authors = ["John Nunley <dev@notgull.net>"]
rust-version.workspace = true
description = "Async signal handling"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/laputa-systems/smolith"
keywords = ["async", "signal", "signal-hook", "signal-hook-registry"]
categories = ["asynchronous", "concurrency", "os"]
exclude = ["/.*"]

[lib]
name = "async_signal"

[dependencies]
futures-core = "0.3.26"

[target.'cfg(unix)'.dependencies]
async-io = { workspace = true }
futures-io = "0.3.26"
rustix = { version = "1.0.7", default-features = false, features = ["process", "std"] }
signal-hook-registry = "1.4.0"

[dev-dependencies]
async-io = { package = "laputa-async-io", path = "../async-io" }
fastrand = { package = "laputa-fastrand", path = "../fastrand" }
futures-lite = { package = "laputa-futures-lite", path = "../futures-lite" }
signal-hook = "0.4.1"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.139"
