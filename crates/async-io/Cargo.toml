[package]
name = "laputa-async-io"
version.workspace = true
authors = ["Stjepan Glavina <stjepang@gmail.com>"]
edition = "2021"
rust-version.workspace = true
description = "Async I/O and timers"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/laputa-systems/smolith"
keywords = ["mio", "epoll", "kqueue", "poll"]
categories = ["asynchronous", "network-programming", "os"]
exclude = ["/.*"]

[lib]
name = "async_io"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(polling_test_poll_backend)', 'cfg(async_io_no_pipe)' ] }

[[bench]]
name = "io"
harness = false

[[bench]]
name = "timer"
harness = false

[dependencies]
cfg-if = "1"
concurrent-queue = { workspace = true, features = ["std"] }
futures-io = { version = "0.3.28", default-features = false, features = ["std"] }
futures-lite = { workspace = true, default-features = false }
parking = { workspace = true }
polling = { workspace = true }
rustix = { version = "1.0.7", default-features = false, features = ["fs", "net", "std"] }
slab = "0.4.2"
tracing = { version = "0.1.37", default-features = false, optional = true }

[build-dependencies]
autocfg = "1"

[dev-dependencies]
async-channel = { package = "laputa-async-channel", path = "../async-channel" }
async-net = { package = "laputa-async-net", path = "../async-net" }
blocking = { package = "laputa-blocking", path = "../blocking" }
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
getrandom = "0.3"
signal-hook = "0.3"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
inotify = { version = "0.11.0", default-features = false }
timerfd = "1"

