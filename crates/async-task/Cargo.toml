[package]
name = "laputa-async-task"
version.workspace = true
authors = ["Stjepan Glavina <stjepang@gmail.com>"]
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0 OR MIT"
repository = "https://github.com/laputa-systems/smolith"
description = "Task abstraction for building executors"
keywords = ["futures", "task", "executor", "spawn"]
categories = ["asynchronous", "concurrency", "no-std"]
exclude = ["/.*"]

[lib]
name = "async_task"

[features]
default = ["std"]
std = []

[dependencies]
# Uses portable-atomic polyfill atomics on targets without them
portable-atomic = { version = "1", optional = true, default-features = false }

[dev-dependencies]
atomic-waker = { workspace = true }
easy-parallel = { workspace = true }
flaky_test = "0.2"
flume = { version = "0.12", default-features = false }
futures-lite = { workspace = true }
once_cell = "1"
pin-project-lite = "0.2.10"
smol = { package = "laputa-smol", path = "../smol" }

# rewrite dependencies to use this version of async-task when running tests
