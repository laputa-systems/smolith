[package]
name = "laputa-smol-macros"
version.workspace = true
edition = "2021"
rust-version.workspace = true
authors = ["John Nunley <dev@notgull.net>"]
description = "Macros for setting up a smol runtime"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/laputa-systems/smolith"
keywords = ["async", "await", "future", "io", "macro"]
categories = ["asynchronous", "concurrency", "network-programming"]
exclude = ["/.*"]

[lib]
name = "smol_macros"

[dependencies]
async-executor = { workspace = true }
async-io = { workspace = true }
event-listener = { workspace = true }
futures-lite = { workspace = true, default-features = false }

[dev-dependencies]
async-lock = { workspace = true }
macro_rules_attribute = "0.2.0"
