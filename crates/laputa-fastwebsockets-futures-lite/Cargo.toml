[package]
name = "laputa-fastwebsockets-futures-lite"
description = "A fast RFC6455 WebSocket implementation adapted for futures-lite::io"
version = "0.10.2"
authors = ["Divy Srivastava <dj.srivastava23@gmail.com>"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.85"
autoexamples = false
autobenches = false
repository = "https://github.com/laputa-systems/smolith"

[lib]
name = "fastwebsockets"

[dependencies]
futures-lite = { workspace = true, features = ["std"] }
simdutf8 = "0.1.5"
getrandom = { version = "0.4.3", features = ["std"] }
thiserror = "2.0.21"
bytes = "1.5.0"

[dev-dependencies]
fastrand = { workspace = true, features = ["std"] }
futures-lite = { workspace = true, features = ["std"] }
