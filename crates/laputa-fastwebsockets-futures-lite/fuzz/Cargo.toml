[package]
name = "fastwebsockets-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
futures-lite = { workspace = true }

[dependencies.fastwebsockets]
workspace = true

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[workspace.dependencies]
fastwebsockets = { package = "laputa-fastwebsockets-futures-lite", path = "..", version = "0.10.2" }
futures-lite = { package = "laputa-futures-lite", path = "../../futures-lite", version = "0.3.0", features = ["std"] }

[profile.release]
debug = 1

[[bin]]
name = "parse_frame"
path = "fuzz_targets/parse_frame.rs"
test = false
doc = false

[[bin]]
name = "parse_frame_fragment"
path = "fuzz_targets/parse_frame_fragment.rs"
test = false
doc = false

[[bin]]
name = "unmask"
path = "fuzz_targets/unmask.rs"
test = false
doc = false
