[package]
name = "laputa-futures-lite"
# When publishing a new version:
# - Update CHANGELOG.md
# - Create "v2.x.y" git tag
version.workspace = true
authors = [
  "Stjepan Glavina <stjepang@gmail.com>",
  "Contributors to futures-rs",
]
edition = "2021"
rust-version.workspace = true
description = "Futures, streams, and async I/O combinators"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/laputa-systems/smolith"
homepage = "https://github.com/smol-rs/futures-lite"
documentation = "https://docs.rs/futures-lite"
keywords = ["asynchronous", "futures", "async"]
categories = ["asynchronous", "concurrency"]
exclude = ["/.*"]

[lib]
name = "futures_lite"

[features]
default = ["race", "std"]
std = ["alloc", "fastrand/std", "futures-io", "parking"]
alloc = []
race = ["fastrand"]

[dependencies]
fastrand = { workspace = true, default-features = false, optional = true }
futures-core = { version = "0.3.5", default-features = false }
futures-io = { version = "0.3.5", optional = true }
memchr = { version = "2.3.3", optional = true }
parking = { workspace = true, optional = true }
pin-project-lite = "0.2.0"

[dev-dependencies]
spin_on = "0.1.0"
waker-fn = { workspace = true }
