[workspace]
resolver = "2"
members = [
    "crates/async-broadcast",
    "crates/async-channel",
    "crates/async-dup",
    "crates/async-executor",
    "crates/async-fs",
    "crates/async-io",
    "crates/async-lock",
    "crates/async-net",
    "crates/async-process",
    "crates/async-signal",
    "crates/async-task",
    "crates/atomic-waker",
    "crates/blocking",
    "crates/concurrent-queue",
    "crates/easy-parallel",
    "crates/event-listener",
    "crates/event-listener-strategy",
    "crates/fastrand",
    "crates/fastrand-contrib",
    "crates/futures-lite",
    "crates/parking",
    "crates/piper",
    "crates/polling",
    "crates/smol",
    "crates/smol-macros",
    "crates/waker-fn",
    "tests/qualify",
]

[workspace.package]
version = "0.2.0"
rust-version = "1.85"

[workspace.dependencies]
async-channel = { package = "laputa-async-channel", version = "0.2.0", path = "crates/async-channel" }
async-executor = { package = "laputa-async-executor", version = "0.2.0", path = "crates/async-executor" }
async-fs = { package = "laputa-async-fs", version = "0.2.0", path = "crates/async-fs" }
async-io = { package = "laputa-async-io", version = "0.2.0", path = "crates/async-io" }
async-lock = { package = "laputa-async-lock", version = "0.2.0", path = "crates/async-lock" }
async-net = { package = "laputa-async-net", version = "0.2.0", path = "crates/async-net" }
async-process = { package = "laputa-async-process", version = "0.2.0", path = "crates/async-process" }
async-signal = { package = "laputa-async-signal", version = "0.2.0", path = "crates/async-signal" }
async-task = { package = "laputa-async-task", version = "0.2.0", path = "crates/async-task" }
atomic-waker = { package = "laputa-atomic-waker", version = "0.2.0", path = "crates/atomic-waker" }
blocking = { package = "laputa-blocking", version = "0.2.0", path = "crates/blocking" }
concurrent-queue = { package = "laputa-concurrent-queue", version = "0.2.0", path = "crates/concurrent-queue", default-features = false }
event-listener = { package = "laputa-event-listener", version = "0.2.0", path = "crates/event-listener", default-features = false }
event-listener-strategy = { package = "laputa-event-listener-strategy", version = "0.2.0", path = "crates/event-listener-strategy", default-features = false }
fastrand = { package = "laputa-fastrand", version = "0.2.0", path = "crates/fastrand", default-features = false }
futures-lite = { package = "laputa-futures-lite", version = "0.2.0", path = "crates/futures-lite", default-features = false }
parking = { package = "laputa-parking", version = "0.2.0", path = "crates/parking" }
piper = { package = "laputa-piper", version = "0.2.0", path = "crates/piper" }
polling = { package = "laputa-polling", version = "0.2.0", path = "crates/polling" }
