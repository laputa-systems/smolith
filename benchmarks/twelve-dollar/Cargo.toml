[workspace]
resolver = "3"
members = ["crates/app-core", "crates/h12tiny-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[workspace.dependencies]
base64 = "0.23"
futures-channel = "0.3.34"
h12tiny = { path = "../../crates/h12tiny", default-features = false }
hmac = "0.13.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
deser = { version = "0.10.2", features = ["derive"] }
deser-json = "0.10.2"
deser-value = "0.10.2"
sha2 = "0.11.1"
signal-hook = "0.4.6"
smol = { package = "laputa-smol", path = "../../crates/smol" }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = false
