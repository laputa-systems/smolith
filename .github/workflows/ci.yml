name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: clippy, test, graph, advisory
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly-2026-09-15
          components: rust-src, clippy
      - name: clippy
        run: cargo clippy --workspace --all-targets
      - name: test
        run: cargo test --workspace
      - name: feature and target check
        run: cargo check --workspace --all-features --all-targets
      - name: graph gate
        run: tools/graph-gate.sh
      - name: advisory scan
        run: tools/advisory-scan.sh

  consumer-and-fixture:
    name: consumer and h12tiny fixture
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly-2026-09-15
          components: rust-src, clippy
      - name: external consumer
        run: tests/consumer/check.sh
      - name: h12tiny fixture
        run: fixtures/h12tiny.sh

  package:
    name: staging registry package
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly-2026-09-15
          components: rust-src, clippy
      - name: publish to staging and consume
        run: tools/stage.sh

  macos:
    name: macos test
    runs-on: macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly-2026-09-15
          components: rust-src, clippy
      - name: test
        run: cargo test --workspace

  musl:
    name: musl check
    runs-on: ubuntu-latest
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      AR_x86_64_unknown_linux_musl: ar
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: musl c toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly-2026-09-15
          components: rust-src, clippy
          targets: x86_64-unknown-linux-musl
      - name: musl libs and tests except laputa-smol
        run: cargo check --workspace --lib --tests --target x86_64-unknown-linux-musl --exclude laputa-smol
      - name: musl laputa-smol lib
        run: cargo check -p laputa-smol --lib --target x86_64-unknown-linux-musl

  no-default-features:
    name: no-default-features
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly-2026-09-15
          components: rust-src, clippy
      - name: isolated library checks
        run: |
          set -eu
          check() {
            cargo check --locked --lib -p "$@"
          }
          check laputa-futures-lite --no-default-features
          check laputa-futures-lite --no-default-features --features alloc
          check laputa-async-task --no-default-features
          check laputa-async-task --no-default-features --features portable-atomic
          check laputa-fastrand --no-default-features
          check laputa-fastrand --no-default-features --features alloc
          check laputa-atomic-waker --no-default-features
          check laputa-atomic-waker --no-default-features --features portable-atomic
          check laputa-waker-fn --no-default-features
          check laputa-waker-fn --no-default-features --features portable-atomic
          check laputa-concurrent-queue --no-default-features
          check laputa-concurrent-queue --no-default-features --features portable-atomic
          check laputa-event-listener --no-default-features
          check laputa-event-listener --no-default-features --features portable-atomic
          check laputa-event-listener-strategy --no-default-features
          check laputa-event-listener-strategy --no-default-features --features portable-atomic
          check laputa-piper --no-default-features
          check laputa-piper --no-default-features --features portable-atomic
          check laputa-async-channel --no-default-features
          check laputa-async-channel --no-default-features --features portable-atomic

  miri:
    name: miri
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly-2026-09-15
          components: rust-src, miri
      - name: setup
        run: cargo miri setup
      - name: task pinning, metadata, and teardown
        run: |
          cargo miri test --locked -p laputa-async-task --test local_task --test metadata --test schedule_lifetime
          cargo miri test --locked -p laputa-async-executor --lib shutdown_test

  loom:
    name: loom
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly-2026-09-15
          components: rust-src, clippy
      - name: close during force_push
        run: RUSTFLAGS='--cfg loom' cargo test --locked -p laputa-concurrent-queue --features loom --test loom close_during_force_push -- --test-threads=1

  msrv:
    name: rust 1.85
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.85.0
      - name: workspace libraries
        run: cargo +1.85.0 check --workspace --lib --locked
      - name: consumer
        run: cargo +1.85.0 check --locked --manifest-path tests/consumer/Cargo.toml --tests
